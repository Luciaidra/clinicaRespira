<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prototipo navegable de Respira, sistema de telerrehabilitación pulmonar.">
<title>Respira Telerrehab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral por rol + área de trabajo. El portal del paciente usa letra grande y una sola acción principal por tarjeta. */
:root{
  --bg:#eef3f4; --surface:#ffffff; --surface-2:#e4ecee; --fg:#11272c; --muted:#56696e; --line:#d2dee1;
  --accent:#0a6e80; --accent-ink:#ffffff; --accent-soft:#d3ecf0;
  --ok:#257a45; --ok-soft:#dcefe2; --warn:#94600f; --warn-soft:#f6ead2; --crit:#b63a26; --crit-soft:#f7dfd9;
  --c1:#0a6e80; --c2:#3a5fb0; --c3:#a0660d; --c4:#7a4fa6; --c5:#2f7d5b;
  --c1s:#d9eff3; --c2s:#e0e7f6; --c3s:#f6ecd9; --c4s:#ece3f5; --c5s:#dcefe6;
  --shadow:0 1px 2px rgba(17,39,44,.06), 0 6px 20px rgba(17,39,44,.06);
  --scrim:rgba(10,30,34,.45);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1618; --surface:#122125; --surface-2:#182c31; --fg:#e2edef; --muted:#93a8ad; --line:#263c41;
  --accent:#4cbccf; --accent-ink:#04252b; --accent-soft:#103a42;
  --ok:#5cc184; --ok-soft:#173a26; --warn:#e3ad52; --warn-soft:#3b2d14; --crit:#f07c66; --crit-soft:#432019;
  --c1:#4cbccf; --c2:#86a5ec; --c3:#e3ad52; --c4:#b996e0; --c5:#6cc79a;
  --c1s:#12343b; --c2s:#1d2a45; --c3s:#3a2e15; --c4s:#2e2440; --c5s:#163a2b;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1618; --surface:#122125; --surface-2:#182c31; --fg:#e2edef; --muted:#93a8ad; --line:#263c41;
  --accent:#4cbccf; --accent-ink:#04252b; --accent-soft:#103a42;
  --ok:#5cc184; --ok-soft:#173a26; --warn:#e3ad52; --warn-soft:#3b2d14; --crit:#f07c66; --crit-soft:#432019;
  --c1:#4cbccf; --c2:#86a5ec; --c3:#e3ad52; --c4:#b996e0; --c5:#6cc79a;
  --c1s:#12343b; --c2s:#1d2a45; --c3s:#3a2e15; --c4s:#2e2440; --c5s:#163a2b;
  --shadow:0 1px 2px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Estructura */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.who{display:flex;gap:10px;align-items:center;padding:10px;background:var(--surface-2);border-radius:var(--r)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;flex:none;font-size:.9rem}
.who strong{display:block;font-size:.92rem;line-height:1.2}
.who span{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:9px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:10px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button:focus-visible{outline:3px solid var(--accent)}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;border-radius:99px;font-size:.7rem;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.78rem;color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .demo-tag{font-size:.75rem;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 9px;border-radius:99px;white-space:nowrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:8px;font-weight:700;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg button:focus-visible{outline:3px solid var(--accent)}
.main{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1180px;width:100%}
.main.big{font-size:17px;max-width:980px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-head p{color:var(--muted);margin-top:4px}

/* Componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn-danger{color:var(--crit)} .btn-danger:hover{border-color:var(--crit);color:var(--crit)}
.btn-sm{padding:5px 10px;font-size:.82rem;min-height:32px;border-radius:8px}
.btn-xl{padding:16px 22px;font-size:1.12rem;min-height:58px;border-radius:14px;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
.btn svg{width:18px;height:18px;flex:none}
.btn-xl svg{width:24px;height:24px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;color:var(--muted);margin-left:2px}
.kpi .d{font-size:.8rem}
.up{color:var(--ok)} .down{color:var(--crit)}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface-2)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:42px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.field .hint{font-size:.75rem;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.err{background:var(--crit-soft);color:var(--crit);padding:10px 12px;border-radius:9px;font-weight:700;font-size:.88rem}
.okbox{background:var(--ok-soft);color:var(--ok);padding:12px 14px;border-radius:10px}
.note-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}

.radio-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.radio-cards label{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.radio-cards input{accent-color:var(--accent);margin-top:3px}
.radio-cards label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio-cards small{display:block;color:var(--muted);font-size:.76rem}

/* Paciente */
.hello{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.hello h1{font-size:2.1rem}
.adh{display:flex;flex-direction:column;gap:6px;min-width:220px}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hero-turno{display:flex;flex-direction:column;gap:16px;padding:22px}
.hero-turno.is-virtual{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ht-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ht-date{display:flex;flex-direction:column;padding:12px 16px;background:var(--accent-soft);border-radius:12px;color:var(--accent);min-width:118px}
.ht-day{font-weight:700;text-transform:capitalize}
.ht-time{font-size:1.9rem;line-height:1.1}
.ht-info{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ht-info strong{font-size:1.15rem}
.ht-hint{color:var(--muted);text-align:center;font-size:.92rem}
.ht-hint.live{color:var(--ok);font-weight:700}
.vitals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vital{background:var(--surface-2);border-radius:12px;padding:14px}
.vital .v{font-family:var(--f-mono);font-size:2rem;line-height:1.1}
.vital .v small{font-size:1rem;color:var(--muted)}
.safety{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:14px 16px}
.safety svg{color:var(--warn);flex:none;width:26px;height:26px}

.exlist{display:flex;flex-direction:column;gap:10px}
.ex{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.ex.done{background:var(--surface-2)}
.ex-body{flex:1;min-width:180px;display:flex;flex-direction:column;gap:3px}
.ex-body strong{font-size:1.02em}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;height:64px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative;overflow:hidden}
.thumb svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.thumb .len{position:absolute;right:5px;bottom:4px;font-size:.66rem;font-family:var(--f-mono);background:var(--surface);color:var(--fg);padding:0 5px;border-radius:5px}
.done-tag{display:inline-flex;gap:6px;align-items:center;color:var(--ok);font-weight:700}
.done-tag svg{width:20px;height:20px}

/* Biblioteca */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.lib .card{display:flex;flex-direction:column;gap:10px;padding:14px}
.lib .thumb{width:100%;height:110px}
.lib .thumb svg{width:46px;height:46px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters .field{flex-direction:row;align-items:center}
.filters input{min-width:200px}

/* Ficha */
.ficha-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ficha-head .avatar{width:56px;height:56px;font-size:1.2rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:3px solid var(--accent)}
.thread{display:flex;flex-direction:column;gap:12px}
.note{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.note.kine{border-left:4px solid var(--c2)} .note.med{border-left:4px solid var(--c1)}
.note .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.note .meta strong{color:var(--fg)}
.replies{margin-left:22px;display:flex;flex-direction:column;gap:10px;border-left:2px dashed var(--line);padding-left:14px}
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:76px 18px minmax(0,1fr);gap:10px;padding-bottom:14px}
.tl-item .when{font-size:.78rem;color:var(--muted);text-align:right;padding-top:2px}
.tl-item .pin{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 4px var(--accent-soft)}

/* Agenda */
.agenda{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:var(--f-mono);font-size:1.02rem;padding-top:2px}
.slot .t small{display:block;font-size:.72rem;color:var(--muted)}
.slot-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot-body .row{gap:6px}
.meet-line{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);word-break:break-all}

/* Charts */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.weeks{display:flex;gap:10px;align-items:flex-end;height:120px;padding-top:8px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:.75rem;color:var(--muted)}
.weeks b{display:block;width:100%;max-width:56px;background:var(--accent);border-radius:6px 6px 2px 2px}
.weeks span.num{color:var(--fg)}

/* Modal y toast */
.modal-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 10px}
.modal-body{padding:6px 20px 20px;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex:none}
.x:hover{background:var(--surface-2)}
.x:focus-visible{outline:3px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* Reproductor */
.player{background:var(--surface-2);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:16px}
.orb-wrap{width:220px;height:220px;display:grid;place-items:center;max-width:100%}
.orb{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 35%,var(--surface)),var(--accent));box-shadow:0 0 0 18px var(--accent-soft);transform:scale(.85);transition-property:transform;transition-timing-function:ease-in-out}
.phase{font-family:var(--f-display);font-size:1.4rem;font-weight:700;text-align:center;min-height:2.2em}
.count{font-family:var(--f-mono);font-size:1rem;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.borg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.borg label{border:1.5px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.borg label b{font-family:var(--f-mono);font-size:1.15rem}
.borg label span{font-size:.7rem;color:var(--muted);line-height:1.15}
.borg input{position:absolute;opacity:0;pointer-events:none}
.borg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.borg label.hi:has(input:checked){border-color:var(--crit);background:var(--crit-soft)}
.borg label:has(input:focus-visible){outline:3px solid var(--accent)}

.guide{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.guide ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.9rem}
.guide .x{margin-left:auto}

.empty{text-align:center;color:var(--muted);padding:28px}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}

function adherencia(pid){
  const as = asigDe(pid); const esperado = as.reduce((s, a) => s + a.veces, 0);
  const hecho = regsDe(pid).filter(r => r.ok && Date.now() - new Date(r.fecha) < 7 * DAY).length;
  return esperado ? Math.min(100, Math.round(hecho / esperado * 100)) : 0;
}
function adherenciaSemanas(pid, n = 4){
  const as = asigDe(pid); const esperado = as.reduce((s, a) => s + a.veces, 0) || 1; const regs = regsDe(pid).filter(r => r.ok);
  return Array.from({length: n}, (_, i) => {
    const hasta = Date.now() - i * 7 * DAY, desde = hasta - 7 * DAY;
    const c = regs.filter(r => { const t = new Date(r.fecha).getTime(); return t > desde && t <= hasta; }).length;
    return {label: i === 0 ? 'Esta sem.' : `Hace ${i}`, pct: Math.min(100, Math.round(c / esperado * 100))};
  }).reverse();
}
function gold(e){
  if (!e || !e.fev1 || !e.fvc) return null;
  const ratio = e.fev1 / e.fvc;
  if (ratio >= 0.7) return {txt:'Sin obstrucción', cls:'ok'};
  const p = e.fev1p;
  if (p >= 80) return {txt:'GOLD 1 · leve', cls:'ok'};
  if (p >= 50) return {txt:'GOLD 2 · moderada', cls:'warn'};
  if (p >= 30) return {txt:'GOLD 3 · grave', cls:'crit'};
  return {txt:'GOLD 4 · muy grave', cls:'crit'};
}
function canJoin(t){
  if (t.mod !== 'Virtual' || !t.meet || ['Cancelado','Atendido','Ausente'].includes(t.estado)) return false;
  const s = new Date(t.inicio).getTime(), e = s + t.dur * MIN, n = Date.now();
  return n >= s - 10 * MIN && n <= e + 30 * MIN;
}
function joinState(t){
  const s = new Date(t.inicio).getTime(); const diff = Math.round((s - Date.now()) / MIN);
  if (canJoin(t)) return {ok:true, msg: diff > 0 ? `Empieza en ${diff} min. Ya podés entrar a la sala.` : 'La sesión está en curso.'};
  if (diff > 0){ const h = Math.floor(diff / 60); return {ok:false, msg:`El botón se habilita 10 minutos antes (faltan ${h ? h + ' h ' : ''}${diff % 60} min).`}; }
  return {ok:false, msg:'La sesión finalizó.'};
}

function lineChart({labels, series, min, max, unit = '', threshold, thresholdLabel, h = 190}){
  const W = 560, H = h, pl = 40, pr = 52, pt = 14, pb = 28, n = labels.length;
  const x = i => pl + (n > 1 ? i * (W - pl - pr) / (n - 1) : (W - pl - pr) / 2);
  const y = v => pt + (max - v) / (max - min) * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 4; k++){ const v = min + (max - min) * k / 4; const yy = y(v);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${fmtNum(v, (max - min) < 8 ? 1 : 0)}</text>`; }
  labels.forEach((l, i) => { if (n <= 8 || i % Math.ceil(n / 8) === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(l)}</text>`; });
  if (threshold != null){ const yy = y(threshold); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="var(--crit)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - pr + 6}" y="${yy + 4}" font-size="11" fill="var(--crit)">${esc(thresholdLabel || '')}</text>`; }
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (si === 0 && pts.length > 1) g += `<path d="${d} L${pts[pts.length - 1][0]} ${H - pb} L${pts[0][0]} ${H - pb} Z" fill="${s.color}" opacity=".10"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 4"' : ''}/>`;
    pts.forEach((p, i) => { const last = i === pts.length - 1; g += `<circle cx="${p[0]}" cy="${p[1]}" r="${last ? 5 : 3}" fill="${last ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="2"/>`; });
    const lp = pts[pts.length - 1], lv = s.values.filter(v => v != null).slice(-1)[0];
    g += `<text x="${lp[0] + 9}" y="${lp[1] + 4}" font-size="12" font-weight="700" fill="${s.color}" font-family="var(--f-mono)">${fmtNum(lv, Number.isInteger(lv) ? 0 : 1)}${esc(unit)}</text>`;
  });
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s => s.name).join(', '))}">${g}</svg>${legend}</div>`;
}

const FICHA = {
  resumen(p){
    const ev = evalsDe(p.id), e = ev[ev.length - 1], f = ev[0], pl = planDe(p.id), labels = ev.map(x => fmtFecha(new Date(x.fecha)));

    if (!e) return '<section class="card empty">Sin evaluaciones todavía.</section>';
    const delta = (a, b, u, inv) => { const d = +(a - b).toFixed(2); if (!d || ev.length < 2) return '<span class="muted">Sin cambios</span>'; const good = inv ? d < 0 : d > 0; return `<span class="${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${fmtNum(d, Number.isInteger(d) ? 0 : 1)}${u} desde el ingreso</span>`; };
    return `<div class="grid g4">
      <div class="card kpi"><span class="eyebrow">SpO₂ reposo</span><span class="v">${e.spo2r}<small>%</small></span><span class="d">${delta(e.spo2r, f.spo2r, ' pts')}</span></div>
      <div class="card kpi"><span class="eyebrow">TM6M</span><span class="v">${e.tm6m}<small>m</small></span><span class="d">${delta(e.tm6m, f.tm6m, ' m')}</span></div>
      <div class="card kpi"><span class="eyebrow">FEV1</span><span class="v">${e.fev1p}<small>% pred.</small></span><span class="d">${delta(e.fev1p, f.fev1p, ' pts')}</span></div>
      <div class="card kpi"><span class="eyebrow">Adherencia 7 días</span><span class="v">${pl ? adherencia(p.id) : 0}<small>%</small></span><span class="d muted">${asigDe(p.id).length} ejercicios asignados</span></div>
    </div>
    <div class="grid g2">
      <section class="card"><div class="card-head"><h3>Saturación de oxígeno</h3></div>${lineChart({labels, series:[{name:'Reposo', values:ev.map(x => x.spo2r), color:'var(--c1)'}, {name:'Esfuerzo', values:ev.map(x => x.spo2e), color:'var(--c3)', dash:true}], min:80, max:100, unit:'%', threshold:pl?.spo2, thresholdLabel:'Umbral'})}</section>
      <section class="card"><div class="card-head"><h3>Test de marcha de 6 minutos</h3></div>${lineChart({labels, series:[{name:'Distancia', values:ev.map(x => x.tm6m), color:'var(--c2)'}], min:Math.floor((Math.min(...ev.map(x => x.tm6m)) - 40) / 50) * 50, max:Math.ceil((Math.max(...ev.map(x => x.tm6m)) + 40) / 50) * 50, unit:' m'})}</section>
    </div>
    <section class="card"><div class="card-head"><h3>Registros domiciliarios recientes</h3><span class="muted" style="font-size:.85rem">Cargados por el paciente desde el portal</span></div>
      ${regs.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Ejercicio</th><th>Completó</th><th>Borg</th><th>SpO₂</th><th>Comentario</th></tr></thead><tbody>
      ${regs.map(r => { const a = S.asignados.find(x => x.id === r.asig), ej = a && ejer(a.ej); return `<tr><td>${diaRel(new Date(r.fecha))} ${fmtHora(new Date(r.fecha))}</td><td>${esc(ej?.titulo || '')}</td><td>${r.ok ? 'Sí' : '<span class="chip warn">Parcial</span>'}</td><td class="num">${r.borg >= 7 ? `<span class="chip crit">${fmtNum(r.borg, 1)}</span>` : fmtNum(r.borg, 1)}</td><td class="num">${r.spo2 != null && pl && r.spo2 < pl.spo2 ? `<span class="chip crit">${r.spo2}%</span>` : (r.spo2 != null ? r.spo2 + '%' : '—')}</td><td>${esc(r.com)}</td></tr>`; }).join('')}
      </tbody></table></div>` : '<p class="empty">Sin registros todavía</p>'}
    </section>`;
  },
  evaluaciones(p){
    const ev = evalsDe(p.id).slice().reverse(), canEdit = S.role === 'neumonologa';
    return `<section class="card"><div class="card-head"><h3>Evaluaciones pulmonares</h3>${canEdit ? `<button class="btn btn-primary" data-act="newEval">${ICONS.plus} Nueva evaluación</button>` : '<span class="muted" style="font-size:.85rem">Solo lectura. Las carga neumonología.</span>'}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>SpO₂ rep./esf.</th><th>FC</th><th>FR</th><th>Borg</th><th>mMRC</th><th>FEV1</th><th>FVC</th><th>FEV1/FVC</th><th>TM6M</th><th>Observaciones</th></tr></thead><tbody>
    ${ev.map(e => `<tr><td>${fmtFecha(new Date(e.fecha))}</td><td class="num">${e.spo2r}% / ${e.spo2e ?? '—'}%</td><td class="num">${e.fc}</td><td class="num">${e.fr ?? '—'}</td><td class="num">${fmtNum(e.borg, 1)}</td><td class="num">${e.mmrc ?? '—'}</td><td class="num">${fmtNum(e.fev1, 2)} L (${e.fev1p}%)</td><td class="num">${fmtNum(e.fvc, 2)} L (${e.fvcp}%)</td><td class="num">${e.fev1 && e.fvc ? fmtNum(e.fev1 / e.fvc, 2) : '—'}</td><td class="num">${e.tm6m ?? '—'} m</td><td style="min-width:200px">${esc(e.obs)}</td></tr>`).join('') || '<tr><td colspan="11" class="empty">Sin evaluaciones</td></tr>'}
    </tbody></table></div></section>`;
  },
  plan(p){
    const pl = planDe(p.id), canEdit = S.role === 'neumonologa';
    if (!pl && !canEdit) return '<section class="card empty">Este paciente todavía no tiene un plan. Lo prescribe neumonología.</section>';
    if (!canEdit) return `<section class="card stack"><div class="card-head" style="margin:0"><h3>Plan prescripto por ${esc(proNombre(pro(pl.pro)))}</h3><span class="chip ok">${pl.estado}</span></div>
      <p>${esc(pl.obj)}</p>

      <div class="note-box">Los umbrales disparan alertas automáticas cuando el paciente registra valores fuera de rango en su casa.</div></section>`;
    const v = pl || {obj:'', ses:3, spo2:88, fc:130, inicio:new Date().toISOString(), fin:new Date(Date.now() + 56 * DAY).toISOString(), estado:'Activo'};
    return `<section class="card"><form data-form="plan" class="stack">
      <div class="card-head" style="margin:0"><h3>${pl ? 'Plan de tratamiento' : 'Prescribir plan de tratamiento'}</h3>${pl ? `<span class="chip ok">${pl.estado}</span>` : ''}</div>

        <div class="field"><label for="pl-spo2">SpO₂ mínima segura (%)</label><input id="pl-spo2" name="spo2" type="number" min="80" max="96" value="${v.spo2}" required><span class="hint">Por debajo, se alerta al equipo</span></div>
        <div class="field"><label for="pl-fc">FC máxima (lpm)</label><input id="pl-fc" name="fc" type="number" min="80" max="200" value="${v.fc}"></div>
        <div class="field"><label for="pl-fin">Fecha de fin</label><input id="pl-fin" name="fin" type="date" value="${v.fin.slice(0, 10)}" required></div>
        <div class="field"><label for="pl-est">Estado</label><select id="pl-est" name="estado">${['Activo','Pausado','Finalizado'].map(s => `<option ${v.estado === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="row"><button class="btn btn-primary" type="submit">${pl ? 'Guardar cambios' : 'Prescribir plan'}</button><span class="muted" style="font-size:.85rem">Al guardar se notifica a kinesiología.</span></div>
    </form></section>`;
  },
  rutina(p){
    const pl = planDe(p.id), as = asigDe(p.id), canEdit = S.role === 'kinesiologo';
    if (!pl) return '<section class="card empty">Sin plan activo. Primero neumonología prescribe el plan; después kinesiología asigna la rutina.</section>';
    return `<section class="card"><div class="card-head"><h3>Rutina asignada</h3>${canEdit ? `<button class="btn btn-primary" data-act="asignar" data-pac="${p.id}">${ICONS.plus} Agregar ejercicio</button>` : '<span class="muted" style="font-size:.85rem">Solo lectura. La asigna kinesiología.</span>'}</div>
    ${as.length ? `<div class="exlist">${as.map(a => { const e = ejer(a.ej); return `<div class="ex">${thumb(e)}<div class="ex-body"><strong>${esc(e.titulo)}</strong><span class="muted">${[a.series && a.reps ? `${a.series}×${a.reps}` : '', a.durSeg ? durTxt(a.durSeg) : '', `${a.veces}×/sem`].filter(Boolean).join(' · ')} · ${e.cat} · ${e.nivel}</span>${a.ind ? `<span style="font-size:.88em">${esc(a.ind)}</span>` : ''}${e.contra ? `<span class="chip warn" style="align-self:flex-start">Contraindicación: ${esc(e.contra)}</span>` : ''}</div>
      <div class="ex-actions"><button class="btn btn-sm" data-act="play" data-id="${e.id}">${ICONS.play} Vista previa</button>${canEdit ? `<button class="btn btn-sm btn-danger" data-act="quitar" data-id="${a.id}">Quitar</button>` : ''}</div></div>`; }).join('')}</div>`
      : `<div class="empty"><p><strong>Plan sin rutina.</strong></p><p>${canEdit ? 'Agregá ejercicios desde la biblioteca para que el paciente los vea en su portal.' : 'Kinesiología todavía no asignó ejercicios.'}</p></div>`}</section>`;
  },
  notas(p){

  }

      <div class="field"><label for="np-tel">Teléfono</label><input id="np-tel" name="tel"></div>
      <div class="field"><label for="np-os">Obra social / prepaga</label><input id="np-os" name="os"></div>
      <div class="field"><label for="np-af">N.º de afiliado</label><input id="np-af" name="afil"></div>
      <div class="field"><label for="np-dx">Motivo de derivación</label><select id="np-dx" name="dx">${Object.entries(CIE).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    </div><p class="muted" style="font-size:.85rem">Al guardar, el paciente recibe un email para activar su acceso al portal.</p></form>`,
      `<button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" type="submit" form="f-pac">Guardar y enviar invitación</button>`, true);
  }
  if (m.type === 'subirEj'){
    return wrap('Subir ejercicio a la biblioteca', `<form data-form="ejercicio" id="f-ej" class="stack">
      <div class="field"><label for="ne-tit">Título</label><input id="ne-tit" name="titulo" required></div>
      <div class="form-grid">
        <div class="field"><label for="ne-cat">Categoría</label><select id="ne-cat" name="cat">${Object.keys(CATS).map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="ne-niv">Nivel</label><select id="ne-niv" name="nivel"><option>Inicial</option><option>Intermedio</option><option>Avanzado</option></select></div>
        <div class="field"><label for="ne-dur">Duración (min)</label><input id="ne-dur" name="dur" type="number" min="1" max="60" value="5"></div>
      </div>
      <div class="field"><label for="ne-pasos">Pasos (uno por línea)</label><textarea id="ne-pasos" name="pasos" required></textarea></div>
      <div class="field"><label for="ne-contra">Contraindicaciones</label><input id="ne-contra" name="contra"></div>
      <div class="field"><label for="ne-vid">Video (MP4)</label><input id="ne-vid" name="video" type="file" accept="video/*"><span class="hint">En la demo el archivo no se sube; en el sistema real va a un almacenamiento privado.</span></div>
    </form>`, `<button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" type="submit" form="f-ej">Agregar a la biblioteca</button>`);
  }
  return '';
}

/* ============ Reproductor ============ */
const player = {running:false, i:0, left:0, elapsed:0, timer:null, id:null};
function startPlayer(id){ stopPlayer(); Object.assign(player, {running:false, i:0, left:PATTERNS[ejer(id).pat][0].s, elapsed:0, id}); }
function stopPlayer(){ clearInterval(player.timer); player.timer = null; player.running = false; }
function playerTick(redrawOnly){
  const e = ejer(player.id); if (!e) return; const pat = PATTERNS[e.pat], ph = pat[player.i];
  const orb = document.getElementById('orb'), phase = document.getElementById('phase'), count = document.getElementById('count'), bar = document.getElementById('pbar');
  if (!orb) return;
  const demoTotal = 60;
  if (player.running || player.elapsed > 0){
    orb.style.transitionDuration = ph.s + 's';
    orb.style.transform = ph.k === 'in' ? 'scale(1.45)' : ph.k === 'out' ? 'scale(.8)' : orb.style.transform || 'scale(1.2)';
    phase.textContent = ph.t; count.textContent = `${Math.ceil(player.left)} s`;
    bar.style.width = Math.min(100, player.elapsed / demoTotal * 100) + '%';
  }
  if (redrawOnly) return;
  player.left -= 1; player.elapsed += 1;
  if (player.left <= 0){ player.i = (player.i + 1) % pat.length; player.left = pat[player.i].s; }
  if (player.elapsed >= demoTotal){ stopPlayer(); phase.textContent = '¡Terminaste! Registrá cómo te sentiste.'; count.textContent = ''; bar.style.width = '100%'; const b = document.getElementById('pbtn'); if (b) b.innerHTML = ICONS.play + ' Repetir'; player.elapsed = 0; player.i = 0; player.left = pat[0].s; }
}
function togglePlayer(){
  const b = document.getElementById('pbtn');
  if (player.running){ stopPlayer(); if (b) b.innerHTML = ICONS.play + ' Reanudar'; return; }
  player.running = true; if (b) b.innerHTML = ICONS.pause + ' Pausar';
  playerTick(false);
  player.timer = setInterval(() => playerTick(false), 1000);
}

/* ============ Acciones ============ */
const ACT = {
  role: d => { S.role = d.r; ui.replyTo = null; save(); render(); window.scrollTo(0, 0); },
  nav: d => { ui.view[S.role] = d.v; ui.turnoResult = null; render(); window.scrollTo(0, 0); },
  ficha: d => { ui.ficha = d.id; ui.fichaTab = 'resumen'; ui.replyTo = null; ui.view[S.role] = 'ficha'; render(); window.scrollTo(0, 0); },
  tab: d => { ui.fichaTab = d.t; render(); },
  hideGuide: () => { ui.guideHidden[S.role] = true; render(); },
  reset: () => { try { localStorage.removeItem(KEY); } catch(e) {} S = seed(); S.role = 'paciente'; ui.view = {paciente:'inicio', neumonologa:'agenda', kinesiologo:'bandeja', recepcion:'agenda'}; ui.guideHidden = {}; toast('Demo reiniciada con los datos de ejemplo'); },
  join: d => openModal('meet', {id:d.id}),
  play: d => { startPlayer(d.id); openModal('player', {id:d.id, asig:d.asig}); },
  playToggle: () => togglePlayer(),
  registrar: d => { stopPlayer(); openModal('registro', {asig:d.asig}); },
  close: () => closeModal(),
  backdrop: (d, el, ev) => { if (ev.target === el) closeModal(); },
  pedirCancel: d => { const t = S.turnos.find(x => x.id === d.id); t.estado = 'Cancelación solicitada'; save(); toast('Pedido enviado. Recepción te va a contactar para reprogramar.'); },
  newEval: () => openModal('eval'),
  asignar: d => openModal('asignar', {pac:d.pac, ej:d.ej}),
  quitar: d => { const a = S.asignados.find(x => x.id === d.id); a.activo = false; save(); toast(`Quitaste "${ejer(a.ej).titulo}" de la rutina`); },
  reply: d => { ui.replyTo = d.id; render(); const t = document.getElementById('nota-txt'); if (t){ t.focus(); t.scrollIntoView({block:'center'}); } },
  cancelReply: () => { ui.replyTo = null; render(); },
  revisar: d => { S.registros.find(r => r.id === d.id).revisada = true; save(); toast('Alerta marcada como revisada'); },
  libCat: d => { ui.lib.cat = d.c; render(); },
  subirEj: () => openModal('subirEj'),
  nuevoPac: () => openModal('paciente'),
  day: d => { ui.dayOff = d.d === '0' ? 0 : ui.dayOff + Number(d.d); render(); },
  estado: d => { const t = S.turnos.find(x => x.id === d.id); t.estado = d.e; save(); toast(`Turno de ${nombre(pac(t.pac))}: ${d.e.toLowerCase()}${d.e === 'Cancelado' && t.meet ? '. Se eliminó el evento de Google Calendar.' : ''}`); },
  copy: d => { const done = () => toast('Enlace copiado'); try { navigator.clipboard.writeText(d.txt).then(done, () => toast(d.txt)); } catch(e) { toast(d.txt); } }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.dataset.act === 'backdrop'){ fn(el.dataset, el, ev); return; }
  ev.preventDefault(); fn(el.dataset, el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && ui.modal) closeModal();
  if (ev.key === 'Enter' && ev.target.matches('tr[data-act]')) ACT[ev.target.dataset.act](ev.target.dataset);
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset.input;
  if (k === 'libQ'){ ui.lib.q = ev.target.value; render(); }
  if (ev.target.closest('form[data-form="evaluacion"]')) updateInterp();
});
document.addEventListener('change', ev => { if (ev.target.dataset.input === 'libNivel'){ ui.lib.nivel = ev.target.value; render(); } });

function updateInterp(){
  const f = document.getElementById('f-eval'), box = document.getElementById('ev-interp'); if (!f || !box) return;
  const fev1 = parseFloat(f.fev1.value), fvc = parseFloat(f.fvc.value), fev1p = parseFloat(f.fev1p.value);
  if (!(fev1 > 0 && fvc > 0)){ box.textContent = 'Completá FEV1 y FVC para calcular la relación y la clasificación.'; return; }
  const g = gold({fev1, fvc, fev1p: isNaN(fev1p) ? 100 : fev1p}); const r = fev1 / fvc;
  box.innerHTML = `FEV1/FVC = <b class="mono">${fmtNum(r, 2)}</b> · ${r < 0.7 ? 'Patrón obstructivo' : 'Sin obstrucción'} ${isNaN(fev1p) && r < 0.7 ? '· cargá FEV1 % predicho para la clasificación GOLD' : `<span class="chip ${g.cls}">${g.txt}</span>`}`;
}

const num = v => v === '' || v == null ? null : Number(v);
document.addEventListener('submit', ev => {
  const f = ev.target, kind = f.dataset.form; if (!kind) return; ev.preventDefault();
  const D = Object.fromEntries(new FormData(f).entries());
  if (kind === 'registro'){
    const a = S.asignados.find(x => x.id === D.asig), pl = S.planes.find(x => x.id === a.plan);
    const spo2 = num(D.spo2), borg = Number(D.borg);
    const alerta = (spo2 != null && spo2 < pl.spo2) || borg >= 7;
    S.registros.push({id:uid(), pac:pl.pac, asig:a.id, fecha:new Date().toISOString(), ok:D.ok === '1', borg, spo2, fc:num(D.fc), com:D.com || '', alerta, revisada:false});
    save(); ui.modal.result = {alerta, spo2, borg}; render(); return;
  }
  if (kind === 'evaluacion'){
    const spo2r = num(D.spo2r), borg = num(D.borg);
    if (spo2r < 50 || spo2r > 100){ ui.modal.error = 'La SpO₂ debe estar entre 50 y 100%.'; render(); return; }
    if (borg < 0 || borg > 10){ ui.modal.error = 'El Borg va de 0 a 10.'; render(); return; }
    S.evaluaciones.push({id:uid(), pac:ui.ficha, pro:'pr1', fecha:new Date().toISOString(), spo2r, spo2e:num(D.spo2e), fc:num(D.fc), fr:num(D.fr), borg, mmrc:num(D.mmrc), fev1:num(D.fev1), fev1p:num(D.fev1p), fvc:num(D.fvc), fvcp:num(D.fvcp), tm6m:num(D.tm6m), cie:D.cie, obs:D.obs});
    pac(ui.ficha).dx = D.cie; save(); ui.modal = null; ui.fichaTab = 'evaluaciones'; toast('Evaluación guardada en la historia clínica'); return;
  }
  if (kind === 'plan'){
    const pl = planDe(ui.ficha);
    const v = {obj:D.obj, ses:num(D.ses), spo2:num(D.spo2), fc:num(D.fc), fin:new Date(D.fin + 'T12:00').toISOString(), estado:D.estado};
    if (pl) Object.assign(pl, v); else S.planes.push({id:uid(), pac:ui.ficha, pro:'pr1', inicio:new Date().toISOString(), ...v});
    save(); toast(pl ? 'Plan actualizado. Se notificó a kinesiología.' : 'Plan prescripto. Kinesiología ya puede asignar la rutina.'); return;
  }
  if (kind === 'nota'){
    const tipo = S.role === 'neumonologa' ? 'Médica' : 'Kinésica';
    S.notas.push({id:uid(), pac:ui.ficha, autor:ME[S.role], padre:ui.replyTo || null, tipo: ui.replyTo ? 'Interconsulta' : tipo, texto:D.texto, visible:!!D.visible, fecha:new Date().toISOString()});
    ui.replyTo = null; save(); toast('Nota agregada a la historia clínica'); return;
  }
  if (kind === 'asignar'){
    const pl = planDe(D.pac);
    if (!pl){ ui.modal.error = `${nombre(pac(D.pac))} no tiene un plan activo. Primero lo prescribe neumonología.`; render(); return; }
    const durMin = num(D.dur);
    S.asignados.push({id:uid(), plan:pl.id, ej:D.ej, series: durMin ? null : num(D.series), reps: durMin ? null : num(D.reps), durSeg: durMin ? durMin * 60 : null, veces:num(D.veces), ind:D.ind || '', orden:S.asignados.length, activo:true, pro:'pr2', desde:new Date().toISOString()});
    save(); ui.modal = null; toast(`"${ejer(D.ej).titulo}" asignado a ${nombre(pac(D.pac))}. Ya lo ve en su portal.`); return;
  }
  if (kind === 'turno'){
    const inicio = new Date(`${D.fecha}T${D.hora}:00`), dur = Number(D.dur);
    if (inicio.getTime() < Date.now()){ ui.turnoResult = {error:'No se puede agendar un turno en el pasado.'}; render(); return; }
    const choca = S.turnos.find(t => t.pro === D.pro && t.estado !== 'Cancelado' && new Date(t.inicio) < new Date(inicio.getTime() + dur * MIN) && new Date(new Date(t.inicio).getTime() + t.dur * MIN) > inicio);
    if (choca){ ui.turnoResult = {error:`${proNombre(pro(D.pro))} ya tiene un turno a las ${fmtHora(new Date(choca.inicio))} con ${nombre(pac(choca.pac))}. Elegí otro horario.`}; render(); return; }
    ui.turnoResult = {loading:true}; render();
    setTimeout(() => {
      const t = {id:uid(), pac:D.pac, pro:D.pro, inicio:inicio.toISOString(), dur, mod:D.mod, estado:'Confirmado', motivo:D.motivo || 'Consulta', meet: D.mod === 'Virtual' ? meetCode() : null};
      S.turnos.push(t); save(); ui.turnoResult = {turno:t}; render();
    }, 900);
    return;
  }
  if (kind === 'paciente'){
    S.pacientes.push({id:uid(), nombre:D.nombre, apellido:D.apellido, dni:D.dni, nac:D.nac, sexo:'', email:D.email, tel:D.tel, os:D.os || 'Particular', afil:D.afil || '', dx:D.dx, o2:false, portal:'Invitación enviada'});
    save(); ui.modal = null; toast(`${D.nombre} ${D.apellido} dado de alta. Invitación enviada a ${D.email}.`); return;
  }
  if (kind === 'ejercicio'){
    S.ejercicios.push({id:uid(), titulo:D.titulo, cat:D.cat, nivel:D.nivel, dur:num(D.dur) * 60, pat:'labios', contra:D.contra || '', pasos:D.pasos.split('\n').map(s => s.trim()).filter(Boolean)});
    save(); ui.modal = null; toast(`"${D.titulo}" agregado a la biblioteca`); return;
  }
});

// Mantiene al día el estado del botón de videollamada sin interrumpir formularios.
setInterval(() => {
  const busy = ui.modal || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (!busy) render();
}, 20000);

render();
</script>
